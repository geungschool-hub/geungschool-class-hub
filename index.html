<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>7반 허브</title>
    <meta name="description" content="우리 반 학급 앱을 한곳에서 — 영단어, 1인 1역 등." />
    <style>
      /* =========================================================
         담임(반) 허브 — 학생용 학급 앱 런처.
         ▶ 매년 학급이 바뀌면 아래 <script>의 HUB_NAME 만 바꾸세요 (예: '8반 허브').
         ▶ 앱 추가/수정은 CONTENTS 배열에 카드 한 칸만 추가하면 됩니다.
         ========================================================= */
      :root {
        --bg: #f6f1ea;
        --bg2: #efe7db;
        --card: #ffffff;
        --text: #2a2118;
        --muted: #6b6055;
        --line: #e4d8c7;
        --accent: #c0530f;
        --shadow: 0 6px 22px rgba(90, 60, 20, 0.1);
        --shadow-hover: 0 12px 30px rgba(90, 60, 20, 0.18);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
      }
      body {
        font-family:
          'Pretendard', system-ui, -apple-system, 'Segoe UI', 'Apple SD Gothic Neo', sans-serif;
        color: var(--text);
        background:
          radial-gradient(1100px 480px at 50% -180px, #f3e3cd 0%, transparent 70%),
          linear-gradient(180deg, var(--bg) 0%, var(--bg2) 100%);
        background-attachment: fixed;
        min-height: 100vh;
        line-height: 1.6;
      }
      .wrap {
        max-width: 1080px;
        margin: 0 auto;
        padding: 40px 20px 64px;
      }
      header {
        text-align: center;
        margin-bottom: 26px;
      }
      .logo {
        font-size: 40px;
        line-height: 1;
      }
      h1 {
        margin: 10px 0 6px;
        font-size: clamp(26px, 5vw, 38px);
        letter-spacing: -0.5px;
      }
      .subtitle {
        margin: 0;
        color: var(--muted);
        font-size: clamp(14px, 2.6vw, 17px);
      }
      .home-link {
        display: inline-block;
        margin-top: 12px;
        color: var(--accent);
        font-size: 13px;
        font-weight: 700;
        text-decoration: none;
      }

      .controls {
        display: flex;
        flex-direction: column;
        gap: 12px;
        align-items: center;
        margin: 24px 0 22px;
      }
      .search {
        width: min(420px, 100%);
        position: relative;
      }
      .search input {
        width: 100%;
        padding: 13px 16px 13px 42px;
        font-size: 16px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: #fff;
        color: var(--text);
        box-shadow: var(--shadow);
      }
      .search input:focus {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }
      .search .icon {
        position: absolute;
        left: 16px;
        top: 50%;
        transform: translateY(-50%);
        font-size: 16px;
        opacity: 0.5;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        justify-content: center;
      }
      .chip {
        border: 1px solid var(--line);
        background: #fff;
        color: var(--muted);
        border-radius: 999px;
        padding: 8px 16px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        min-height: 40px;
      }
      .chip.on {
        background: var(--accent);
        color: #fff;
        border-color: var(--accent);
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        gap: 18px;
      }
      .card {
        display: flex;
        flex-direction: column;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 20px;
        text-decoration: none;
        color: inherit;
        box-shadow: var(--shadow);
        transition:
          transform 0.16s ease,
          box-shadow 0.16s ease;
        position: relative;
        min-height: 184px;
      }
      a.card:hover {
        transform: translateY(-4px);
        box-shadow: var(--shadow-hover);
      }
      a.card:focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 2px;
      }
      .card.soon {
        opacity: 0.72;
        cursor: default;
      }
      .card-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
      }
      .emoji {
        width: 52px;
        height: 52px;
        border-radius: 14px;
        display: grid;
        place-items: center;
        font-size: 28px;
      }
      .tag {
        font-size: 12px;
        font-weight: 700;
        padding: 4px 10px;
        border-radius: 999px;
      }
      .card h2 {
        margin: 0 0 6px;
        font-size: 19px;
      }
      .card p {
        margin: 0;
        color: var(--muted);
        font-size: 14px;
        flex: 1;
      }
      .card-go {
        margin-top: 14px;
        font-size: 14px;
        font-weight: 700;
        color: var(--accent);
      }
      .badge-soon {
        font-size: 12px;
        font-weight: 700;
        color: #8a6d12;
        background: #fdeecb;
        padding: 4px 10px;
        border-radius: 999px;
      }
      .empty {
        grid-column: 1 / -1;
        text-align: center;
        color: var(--muted);
        padding: 40px 0;
        font-size: 15px;
      }
      footer {
        margin-top: 48px;
        padding-top: 18px;
        border-top: 1px solid var(--line);
        text-align: center;
        color: var(--muted);
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <div class="logo">🏫</div>
        <h1 id="hub-title">7반 허브</h1>
        <p class="subtitle">우리 반 학습·생활 앱을 한곳에서 만나요!</p>
        <a class="home-link" href="https://geungschool-hub.github.io/">← 통합 허브로</a>
      </header>

      <div class="controls">
        <div class="search">
          <span class="icon">🔍</span>
          <input id="search" type="search" placeholder="앱 검색 (예: 영단어, 포털)" aria-label="앱 검색" />
        </div>
        <div class="chips" id="chips" role="group" aria-label="구분 필터"></div>
      </div>

      <main class="grid" id="grid"></main>

      <footer>Claude AI로 이 앱을 제작함 by 고은표</footer>
    </div>

    <script>
      /* =========================================================
         ▼ 매년 학급이 바뀌면 이 이름만 변경 (예: '8반 허브')
         ========================================================= */
      const HUB_NAME = '7반 허브';

      /* ▼▼▼ 학급 앱 목록 — 새 앱을 만들면 여기에 카드 한 칸 추가 ▼▼▼
         { title, desc, url, group(구분), emoji, status('live'|'soon') } */
      const CONTENTS = [
        {
          title: '학급 임원 선거 투표소',
          desc: '학급회장·부회장 선거 — 내 폰으로 기표해요.',
          url: 'https://geungschool-hub.github.io/class-vote/',
          group: '학급',
          emoji: '🗳️',
          status: 'live',
        },
        {
          title: '영단어 학습',
          desc: '꾸준함이 생명인 영단어 암기 챌린지!',
          url: 'https://gongju7-vocab.web.app/',
          group: '학습',
          emoji: '📚',
          status: 'live',
        },
        {
          title: '1인 1역 기록',
          desc: '내가 맡은 1인 1역 활동을 직접 기록해요.',
          url: 'https://geungschool-hub.github.io/1p1t/',
          group: '생활',
          emoji: '✅',
          status: 'live',
        },
        {
          title: '번호 뽑기',
          desc: '수업·활동에서 쓰는 무작위 번호 뽑기.',
          url: 'https://geungschool-hub.github.io/random-picker/',
          group: '활동',
          emoji: '🎲',
          status: 'live',
        },
        {
          title: '얼리버드',
          desc: '얼리버드 활동 앱.',
          url: 'https://geungschool-hub.github.io/early-bird/',
          group: '활동',
          emoji: '🐤',
          status: 'live',
        },
        {
          title: '수강신청 사전 점검',
          desc: '내 과목 선택이 이수 조건을 충족하는지 즉석 확인.',
          url: 'https://geungschool-hub.github.io/ai-tool/수강신청점검/',
          group: '학습',
          emoji: '🗓️',
          status: 'live',
        },
        {
          title: '기말고사 목표 점수',
          desc: '내가 보는 과목을 체크하고 과목별 목표 점수를 적어요.',
          url: 'https://exam-goal.web.app/',
          group: '학습',
          emoji: '🎯',
          status: 'live',
        },
        {
          title: '현장체험학습 기록',
          desc: '현장체험학습 마무리 질문에 답하며 활동을 기록해요.',
          url: 'https://fieldtrip-hyehwa.vercel.app',
          group: '활동',
          emoji: '✍️',
          status: 'live',
        },
      ];
      /* ▲▲▲ 여기까지만 고치면 됩니다 ▲▲▲ */

      const GROUP_COLORS = {
        학급: { fg: '#c0530f', bg: '#fcebdc' },
        학습: { fg: '#1255a0', bg: '#e2ecf8' },
        생활: { fg: '#2a7a38', bg: '#e6f4e9' },
        활동: { fg: '#7d3c98', bg: '#f0e6f5' },
        예고: { fg: '#8a6d12', bg: '#fdeecb' },
      };
      const DEFAULT_COLOR = { fg: '#665', bg: '#f1ece4' };
      const colorOf = (g) => GROUP_COLORS[g] || DEFAULT_COLOR;

      // 제목 적용
      document.getElementById('hub-title').textContent = HUB_NAME;
      document.title = HUB_NAME;

      const grid = document.getElementById('grid');
      const chipsBox = document.getElementById('chips');
      const searchInput = document.getElementById('search');
      let activeGroup = '전체';
      let query = '';

      const groups = ['전체', ...Array.from(new Set(CONTENTS.map((c) => c.group)))];
      function renderChips() {
        chipsBox.innerHTML = '';
        groups.forEach((g) => {
          const b = document.createElement('button');
          b.className = 'chip' + (g === activeGroup ? ' on' : '');
          b.textContent = g;
          b.onclick = () => {
            activeGroup = g;
            renderChips();
            renderCards();
          };
          chipsBox.appendChild(b);
        });
      }

      function matches(c) {
        if (activeGroup !== '전체' && c.group !== activeGroup) return false;
        if (!query) return true;
        return (c.title + ' ' + c.desc + ' ' + c.group).toLowerCase().includes(query);
      }

      function renderCards() {
        const list = CONTENTS.filter(matches);
        grid.innerHTML = '';
        if (list.length === 0) {
          grid.innerHTML = '<div class="empty">조건에 맞는 앱이 없어요. 검색어나 구분을 바꿔 보세요.</div>';
          return;
        }
        list.forEach((c) => {
          const col = colorOf(c.group);
          const isSoon = c.status === 'soon';
          const el = document.createElement(isSoon ? 'div' : 'a');
          el.className = 'card' + (isSoon ? ' soon' : '');
          if (!isSoon) {
            el.href = c.url;
            el.target = '_blank';
            el.rel = 'noopener';
          }
          el.innerHTML = `
            <div class="card-top">
              <div class="emoji" style="background:${col.bg}">${c.emoji}</div>
              ${
                isSoon
                  ? '<span class="badge-soon">준비 중</span>'
                  : `<span class="tag" style="color:${col.fg};background:${col.bg}">${c.group}</span>`
              }
            </div>
            <h2>${c.title}</h2>
            <p>${c.desc}</p>
            ${isSoon ? '' : '<div class="card-go">열어 보기 →</div>'}
          `;
          grid.appendChild(el);
        });
      }

      searchInput.addEventListener('input', (e) => {
        query = e.target.value.trim().toLowerCase();
        renderCards();
      });

      renderChips();
      renderCards();
    </script>

  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD1 = 0x11;

    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

            if (_modules[row][col - c] == null) {

              if (byteIndex < data.length) {

              _modules[row][col - c] = dark;

      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

        var ecCount = rsBlocks[r].totalCount - dcCount;

        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }

      return data;

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

  }
  function closeQr() {

    document.body.style.overflow = '';
